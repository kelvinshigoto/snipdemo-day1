name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend -- --watch=false --browsers=ChromeHeadless

      - name: Check CLI syntax
        run: node --check bundle/cli.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image locally for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./bundle
          load: true
          push: false
          tags: snip-local:scan

      - name: Smoke-test bundled API and CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name snip-smoke --publish 3000:3000 snip-local:scan
          cleanup() {
            docker stop snip-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/links >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:3000/ | grep -q '<app-root'

          created="$(curl --fail --silent --request POST http://127.0.0.1:3000/api/links \
            --header 'content-type: application/json' \
            --data '{"url":"https://example.com"}')"
          code="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).code)' "$created")"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000/$code")" = 302
          curl --fail --silent http://127.0.0.1:3000/api/links | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const links=JSON.parse(s);if(links.length!==1||links[0].hits!==1)process.exit(1)})'
          SNIP_API=http://127.0.0.1:3000 node bundle/cli.js ls | grep -q "$code"

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: snip-local:scan
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Audit shipped frontend dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Publish verified image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag snip-local:scan "$tag"
            docker push "$tag"
            echo "Published $tag"
          done <<< "$IMAGE_TAGS"
